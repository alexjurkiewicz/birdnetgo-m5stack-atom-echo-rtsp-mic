<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>M5Stack Atom Echo - RTSP Microphone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css"
    />
    <!--
      Development linkage: keep this local stylesheet reference so `src/web/index.html`
      can be served and tested directly while editing `src/web/style.css`.
      Build linkage: `tools/embed_html.py` replaces this tag with inline CSS in the
      generated `src/webui_html.h` header before firmware compilation.
    -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Development linkage: keep this module entry point so the raw web assets work
      together before the embed step. `app.js` pulls Preact/HTM from esm.sh and mounts
      into `#app` when testing the standalone page.
      Build linkage: `tools/embed_html.py` replaces this tag with an inline
      `<script type="module">...</script>` block for the embedded firmware UI.
    -->
    <script type="module" src="app.js"></script>
  </body>
</html>
